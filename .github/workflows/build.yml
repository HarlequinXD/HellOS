name: Build HellOS APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Bundle the pixel font (works offline on the phone)
        continue-on-error: true
        run: |
          curl -fsSL -o app/src/main/assets/www/fonts/PixelifySans.ttf \
            "https://github.com/google/fonts/raw/main/ofl/pixelifysans/PixelifySans%5Bwght%5D.ttf"
          ls -la app/src/main/assets/www/fonts

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HellOS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HellOS-apk
          path: HellOS.apk

      # Always-current download link for the phone: Releases > "latest-build".
      - name: Publish latest build
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: HellOS latest build
          prerelease: true
          make_latest: false
          body: "Automatic build from ${{ github.sha }}. Install HellOS.apk on your phone."
          files: HellOS.apk
